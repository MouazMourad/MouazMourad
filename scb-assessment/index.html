pendencies and owners","focus":"مهم","ask":"لو بدنا نتفق على خطة تحسين، شو الأمور اللي لازم ننجزها خلال شهر، وثلاثة أشهر، وستة أشهر؟"},{"id":"INF-137","section":"14-جرد الأنظمة والخدمات","question":"وجود سجل معتمد للأنظمة والتطبيقات والخدمات مصنف حسب الاسم والمورد والنسخة وبيئة التشغيل","evidence":"Service & Application Inventory / CMDB","focus":"عاجل","ask":"عندكم قائمة حديثة بكل الأنظمة والبرامج الموجودة، مع اسم البرنامج والإصدار والشركة المسؤولة؟"},{"id":"INF-138","section":"14-جرد الأنظمة والخدمات","question":"التفرقة بين عدد الأنظمة المنطقية والتطبيقات التابعة ومثيلات الإنتاج وVMs","evidence":"Application catalog vs instances/VM count","focus":"عاجل","ask":"حتى نحسب صح: قديش عدد الأنظمة المستقلة، وقديش تطبيق تابع لها، وقديش سيرفر بتشتغل عليها؟"},{"id":"INF-139","section":"14-جرد الأنظمة والخدمات","question":"حصر الأنظمة المبنية داخلياً والأنظمة المشتراة والحلول المرتبطة بمزود خارجي","evidence":"Application portfolio / vendors / integrations","focus":"مهم","ask":"أي أنظمة طورها فريق البنك، وأيها مشتراة أو مسؤول عنها مورد خارجي؟"},{"id":"INF-140","section":"14-جرد الأنظمة والخدمات","question":"تحديد المالك التشغيلي والفني لكل خدمة وعقود الدعم ومواعيد الانتهاء","evidence":"Service owners / RACI / support contracts","focus":"عاجل","ask":"لكل نظام، مين مسؤول عنه من جهة العمل ومين من جهة التقنية؟ والدعم لحد إمتى متوفر؟"},{"id":"INF-141","section":"14-جرد الأنظمة والخدمات","question":"تصنيف كل نظام حسب حرجية الأعمال وليس حسب قيمة الخادم أو سعر الترخيص","evidence":"Business impact analysis (BIA) signed","focus":"عاجل","ask":"كيف بتقرروا إن نظاماً ما حرج جداً أو متوسط؟ بناءً على أثر توقفه على خدمة العملاء مثلاً؟"},{"id":"INF-142","section":"14-جرد الأنظمة والخدمات","question":"تصنيف حساسية البيانات بشكل مستقل عن مستوى الحرجية التشغيلية","evidence":"Information classification / sensitive data map","focus":"عاجل","ask":"أي أنظمة فيها بيانات عملاء أو معلومات حساسة جداً حتى لو توقفها ما بيوقف العمل مباشرة؟"},{"id":"INF-143","section":"14-جرد الأنظمة والخدمات","question":"تح  عند الحاجة ومن عدم تحوله هو نفسه إلى SPOF","evidence":"LB topology, HA pair, failover evidence","focus":"عاجل","ask":"الخدمات اللي تحتاج توزيع حمل، فيها Load Balancer احتياطي؟ وإذا وقع جهاز التوزيع، شو بيصير؟"},{"id":"INF-151","section":"15-التوافر حسب الخدمة","question":"إعداد Health Checks صحيحة ومسارات خروج عقد غير سليمة","evidence":"LB health probes and traffic routing logs","focus":"مهم","ask":"كيف بتعرفوا أن نسخة التطبيق ما عادت سليمة وبتوقفوا إرسال طلبات إلها تلقائياً؟"},{"id":"INF-152","section":"15-التوافر حسب الخدمة","question":"التحقق من Cluster/Failover الحقيقي على طبقة التطبيق وليس مجرد تعدد VMs","evidence":"HA topology / failover test / quorum","focus":"عاجل","ask":"وجود أكثر من سيرفر للتطبيق يعني فعلاً أنه بينتقل تلقائياً عند العطل؟ وهل جرّبتوا هالشي؟"},{"id":"INF-153","section":"15-التوافر حسب الخدمة","question":"التحقق من Cluster/Replication لقاعدة البيانات وتوافقه مع سلامة المعاملات","evidence":"DB replication mode / failover / consistency test","focus":"عاجل","ask":"إذا قاعدة البيانات الرئيسية وقفت، كيف بتشتغل البديلة وبتتأكدوا أن المعاملات ما ضاعت أو تكررت؟"},{"id":"INF-154","section":"15-التوافر حسب الخدمة","question":"عدم مشاركة جميع عقد HA في SAN/Network/Power واحد يشكّل نقطة فشل","evidence":"SPOF topology by fault domain","focus":"عاجل","ask":"عقد الـCluster موجودة على نفس التخزين أو الكهرباء أو الشبكة؟ وإذا تعطل هالجزء، شو بيصير للجميع؟"},{"id":"INF-155","section":"15-التوافر حسب الخدمة","question":"التأكد من أن Redundancy تغطي Firewall, DNS, AD, WAN, Storage وليس التطبيق فقط","evidence":"End-to-end dependency map","focus":"عاجل","ask":"غير التطبيق نفسه، هل عندكم بدائل للشبكة والجدار الناري والـDNS والدومين والتخزين؟"},{"id":"INF-156","section":"15-التوافر حسب الخدمة","question":"تحديد الخدمات التي تحتاج Active-Active أو Active-Passive أو استرجاع يدوي مبرر","evidence":"Per-service HA design decision","focus":"مهم","ask":"أي الأنظمة شغالة بنسختين مع بعض، وأيها وحدة أساسية ووحدة احتياط، وأيها استعادتها يدوية؟ وليش؟"},{"id":"INF-157","section":"15-التوافر حسب الخدمة","question":"وجود Capacity Headroom كافٍ ليستوعب عقد البقاء الحمل بعد فقد عقدة","evidence":"N+1 and load/capacity evidence","focus":"مهم","ask":"إذا توقفت عقدة من الـCluster بوقت الذروة، هل الباقي بيتحمل الحمل بدون تراجع كبير بالخدمة؟"},{"id":"INF-158","section":"15-التوافر حسب الخدمة","question":"دراسة الاعتمادية على واجهات API وESB ومزوّدي الخدمات بين الأنظمة","evidence":"Integration dependencies and outage behavior","focus":"عاجل","ask":"إذا تعطل API أو وسيط ربط أو مزود خارجي، هل الخدمة كلها بتوقف ولا في طريقة تكمل جزئياً؟"},{"id":"INF-159","section":"16-الاستعادة وDR للخدمات","question":"خطة استرجاع موثقة لكل خدمة حرجة تتضمن ترتيب المكونات ومن ينفذها","evidence":"Per-service Runbook / restoration orchestration","focus":"عاجل","ask":"لكل نظام حساس، هل في خطوات استعادة مكتوبة بتوضح شو نرجّع أولاً ومين مسؤول؟"},{"id":"INF-160","section":"16-الاستعادة وDR للخدمات","question":"آخر اختبار Restore ناجح لكل خدمة وليس فقط نجاح مهام Backup","evidence":"Restore test evidence with dates","focus":"عاجل","ask":"متى آخر مرة رجّعتوا هالخدمة فعلياً من Backup، مو بس تأكدتوا أن النسخ نجحت؟"},{"id":"INF-161","section":"16-الاستعادة وDR للخدمات","question":"التحقق من استعادة تطبيق وقاعدة بيانات وإعدادات وتشفير وتكامل الخدمة","evidence":"Full-service recovery test report","focus":"عاجل","ask":"بتجربة الاستعادة، هل رجع التطبيق مع قاعدة البيانات والإعدادات والتكاملات واشتغل من أوله لآخره؟"},{"id":"INF-162","section":"16-الاستعادة وDR للخدمات","question":"قياس RTO/RPO الفعليين ومقارنتهما بأهداف كل خدمة معتمدة","evidence":"Measured vs target RTO/RPO by service","focus":"عاجل","ask":"بعد آخر تجربة استعادة، قديش أخذ الوقت الفعلي؟ وقديش بيانات ممكن تكون فقدت مقارنة بالمسموح؟"},{"id":"INF-163","section":"16-الاستعادة وDR للخدمات","question":"وجود خطة DR خاصة بكل خدمة حرجة تشمل المشاركين والاعتماديات","evidence":"DR orchestration by application/service","focus":"عاجل","ask":"للخدمات المصرفية الأهم، في خطة DR خاصة بكل واحدة بتحدد الفريق والخطوات والخدمات التابعة؟"},{"id":"INF-164","section":"16-الاستعادة وDR للخدمات","question":"آخر اختبار تحويل DR / Failover مع نجاح العمليات المصرفية النهائية","evidence":"Full failover test with end-to-end transactions","focus":"عاجل","ask":"آخر مرة نقلتوا الخدمة للموقع البديل، هل جربتوا تنفيذ معاملة مصرفية ناجحة من البداية للنهاية؟"},{"id":"INF-165","section":"16-الاستعادة وDR للخدمات","question":"توثيق رجوع الخدمة من DR للمركز الأساسي Failback وسلامة البيانات","evidence":"Failback test / data reconciliation","focus":"عاجل","ask":"إذا اشتغلت الخدمة بالموقع البديل، كيف بترجعوا للمركز الرئيسي بدون فقد أو تضارب بالبيانات؟"},{"id":"INF-166","section":"16-الاستعادة وDR للخدمات","question":"التحقق من استرجاع الخدمات بترتيب DNS, AD, Networking, DB, Apps عند الحاجة","evidence":"Recovery sequence and dependency critical path","focus":"عاجل","ask":"وقت الاستعادة، بأي ترتيب بترجعوا الشبكة والدومين والـDNS وقواعد البيانات والتطبيقات؟"},{"id":"INF-167","section":"16-الاستعادة وDR للخدمات","question":"وجود خطط بديلة عند فشل مورد ثالث أو منصة دفع أو ربط فرع","evidence":"Third-party contingency and outage runbook","focus":"مهم","ask":"إذا وقع مزود دفع خارجي أو انقطع ربط أحد الفروع، شو البديل التشغيلي المتفق عليه؟"},{"id":"INF-168","section":"16-الاستعادة وDR للخدمات","question":"تحديد الخدمات التي لا يغطّيها DR أو Backup وتوثيق قبول مخاطرها","evidence":"Coverage exceptions / risk acceptance","focus":"عاجل","ask":"في خدمات مهمة حالياً ما بيغطيها Backup أو DR؟ وإذا نعم، مين مطّلع على هالمخاطرة وموافق عليها؟"},{"id":"INF-169","section":"16-الاستعادة وDR للخدمات","question":"مراقبة سلامة المعاملة والمطابقة المحاسبية بعد التحويل أو الاسترجاع","evidence":"Transaction reconciliation / data integrity signoff","focus":"عاجل","ask":"بعد استعادة النظام أو التحويل للموقع البديل، كيف بتتأكدوا أن كل القيود والحركات المصرفية متطابقة؟"},{"id":"INF-170","section":"17-التدقيق على التصميم","question":"وجود High Availability بدون اعتماد على منطقة أو مزود أو مسار واحد","evidence":"Fault domain separation evidence","focus":"مهم","as function answerCard(q,compact=false){let a=db.answers[q.id]||{};let status=['متوفر ويعمل','متوفر جزئياً','بحاجة إلى تحسين','غير متوفر','قيد التحقق','لا ينطبق'];let priority=['حرج','عالٍ','متوسط','منخفض','تحسين مستقبلي'];return `<article class="panel questionCard ${compact?'compact':''}" data-question="${attr(q.id)}"><div class="spaceBetween"><div class="titleLine"><span class="questionNum">${esc(q.id)}</span>${chip(q.focus,q.focus==='عاجل'?'focus':'')}${a.status?chip(a.status,a.status==='متوفر ويعمل'?'good':''):''}</div><span class="miniInfo">${esc(domainTitle(q.section))}</span></div><div class="askLabel">💬 سؤال ممكن تحكيه مع الفريق</div><h2 class="questionHead">${esc(q.ask||q.question)}</h2><div class="technicalContext"><strong>الموضوع الفني:</strong> ${esc(q.question)}</div><div class="evidenceHint">◉ <b>يمكن الاستئناس بـ:</b> ${esc(q.evidence||'مناقشة الفريق أو الاطلاع على دليل مناسب')}</div><div class="pillSelect" aria-label="توصيف الوضع الحالي"><label><span class="miniInfo">حالة النقطة: </span><select data-answer="status" data-id="${attr(q.id)}">${opts(status,a.status,'حدّد بعد سماع الإجابة')}</select></label><label><span class="miniInfo">أولوية المعالجة: </span><select data-answer="priority" data-id="${attr(q.id)}">${opts(priority,a.priority,'عند وجود فرصة تحسين')}</select></label></div><div class="cardGrid">${['current','observation','solution'].map((key,i)=>`<div class="field"><label>${['① كيف هو الوضع الحالي؟','② شو الملاحظات؟','③ شو التحسين المقترح؟'][i]}</label><textarea data-answer="${key}" data-id="${attr(q.id)}" placeholder="${['ما الذي يعمل حالياً؟ كيف تم شرحه؟','مواطن القوة والفجوات وأي شيء يحتاج توضيحاً…','اقتراح عملي يناسب أهمية الخدمة والموارد…'][i]}">${esc(a[key]||'')}</textarea></div>`).join('')}</div><details class="extraFields"><summary>تفاصيل إضافية (الدليل، المسؤول، المدة)</summary><div class="formGrid" style="margin-top:13px"><div class="field"><label>المرجع أو الدليل المعروض</label><input data-answer="evidence" data-id="${attr(q.id)}" value="${attr(a.evidence||'')}" placeholder="مثلاً رقم مستند أو تاريخ تجربة"></div><div class="field"><label>المسؤول المقترح</label><input data-answer="owner" data-id="${attr(q.id)}" value="${attr(a.owner||'')}" placeholder="المجال / الفريق"></div><div class="field"><label>الإطار الزمني المقترح</label><input data-answer="deadline" data-id="${attr(q.id)}" value="${attr(a.deadline||'')}" placeholder="فوري / 30 يوم / لاحقاً"></div></div></details></article>`;}
function renderAssessment(){let qs=SOURCE.questions.filter(q=>q.section===domain);qindex=Math.max(0,Math.min(qindex,qs.length-1));let count=qs.filter(q=>filled(db.answers[q.id])).length;return `<div class="sectionTitle"><div><div class="eyebrow">المجال ${domainIds.indexOf(domain)+1} من ${domainIds.length}</div><h2>${esc(domainTitle(domain))}</h2><p>لكل نقطة سؤال جاهز بلغة بسيطة؛ الحوار مرن، ويمكن تعديل صياغته أثناء الزيارة.</p></div></div><div class="panel noPrint"><div class="spaceBetween"><div class="toolbar"><label class="muted">المجال:</label><select id="domainSelect">${domainIds.map(s=>`<option value="${attr(s)}" ${s===domain?'selected':''}>${esc(domainTitle(s))}</option>`).join('')}</select><select id="modeSelect"><option value="single" ${mode==='single'?'selected':''}>سؤال جاهز كل مرة</option><option value="all" ${mode==='all'?'selected':''}>كل أسئلة المجال (تمرير)</option></select></div>${chip(`${count} من ${qs.length} تمت مناقشتها`,'good')}</div><div class="stepBar bar"><span style="width:${Math.round(count/qs.length*100)}%"></span></div>${mode==='single'?`<div class="spaceBetween"><div class="muted">السؤال ${qindex+1} من ${qs.length}</div><select id="questionSelect" style="max-width:70%;padding:7px;border:1px solid var(--line);border-radius:9px;background:white">${qs.map((q,i)=>`<option value="${i}" ${i===qindex?'selected':''}>${i+1} · ${esc((q.ask||q.question).slice(0,65))}</option>`).join('')}</select></div>`:''}</div>
${mode==='single'?answerCard(qs[qindex]):qs.map(q=>answerCard(q,true)).join('')}
<div class="pager noPrint">${btn('السابق','previous','')}${mode==='single'?`<span>سؤال ${qindex+1} / ${qs.length} · يمكن الانتقال دون تعبئة</span>`:`<span>${qs.length} نقطة في هذا المجال</span>`}${btn(mode==='single'?'التالي ←':'المجال التالي ←','next','primary')}</div>`}
const fieldGroup=(obj,defs,scope)=>defs.map(([key,label,type,placeholder,options,size])=>`<div class="field ${size||''}"><label>${esc(label)}</label>${type==='textarea'?`<textarea data-${scope==='service'?'svc-field':scope}="${attr(key)}" placeholder="${attr(placeholder||'')}">${esc(obj[key]||'')}</textarea>`:type==='select'?`<select data-${scope==='service'?'svc-field':scope}="${attr(key)}">${opts(options||[],obj[key]||'',placeholder||'اختر…')}</select>`:`<input data-${scope==='service'?'svc-field':scope}="${attr(key)}" type="${type||'text'}" value="${attr(obj[key]||'')}" placeholder="${attr(placeholder||'')}">`}</div>`).join('');

function renderInventory(){let s=db.services.find(x=>x.id===currentService);let list=db.services.filter(x=>(x.name||'').includes(inventorySearch)||(x.category||'').includes(inventorySearch));return `<div class="sectionTitle"><div><h2>الأنظمة والبرامج والخدمات المصرفية</h2><p>كل خدمة تُسجّل مرة واحدة، ثم نربطها بدرجة الحرجية والتوافر وDR وفق طبيعتها.</p></div><button class="btn primary" data-action="addService">＋ إضافة نظام فعلي</button></div><div class="notice">لا توجد أنظمة مفترضة مسبقاً. القائمة المقترحة أدناه هي للاستكشاف فقط؛ لا تضف نظاماً إلا إذا أكد الفريق وجوده.</div><div class="panel spaceBetween"><div><strong>${db.services.length}</strong> خدمات موثقة · <span class="muted">فصل التطبيقات المنطقية عن الخوادم والنسخ والـModules</span></div><div class="toolbar"><select id="catalogSelect"><option value="">قائمة فئات للاستكشاف (40)…</option>${SOURCE.catalog.map((x,i)=>`<option value="${i}">${esc(x.group+' — '+x.name)}</option>`).join('')}</select><button class="btn small" data-action="addFromCatalog">إضافة بعد التأكد</button></div></div>
<div class="serviceLayout"><div class="panel" style="margin-top:0"><div class="field"><label>بحث عن خدمة</label><input id="serviceSearch" value="${attr(inventorySearch)}" placeholder="اسم النظام أو تصنيفه"></div><div class="serviceList" style="margin-top:12px">${list.length?list.map(x=>`<button class="servicePick ${currentService===x.id?'active':''}" data-service="${attr(x.id)}"><strong>${esc(x.name||'نظام بلا اسم')}</strong><span>${esc(x.category||'غير مصنّف')} · ${esc(x.criticality||'لم تُحدد الحرجية')}</span></button>`).join(''):'<div class="muted" style="padding:12px">لا توجد نتائج بعد.</div>'}</div></div>

function renderEvidence(){const list=SOURCE.evidence.filter(x=>evidenceFilter==='all'||(db.documents[x.id]?.status||'')===evidenceFilter);return `<div class="sectionTitle"><div><h2>الأدلة والمستندات</h2><p>تسجيل ما تم عرضه مع الفريق، دون نقل ملفات البنك السرية إلى الأداة.</p></div><div class="toolbar"><select id="evidenceFilter"><option value="all">جميع الطلبات</option>${['تم العرض','لم يُعرض بعد','لا ينطبق','قيد المراجعة'].map(v=>`<option value="${attr(v)}" ${v===evidenceFilter?'selected':''}>${esc(v)}</option>`).join('')}</select></div></div><div class="hint">الأفضل مشاهدة الدليل على جهاز مخوّل أو تدوين مرجعه وتاريخ المراجعة. تجنب نسخ Configurations أو عناوين IP أو معلومات تشغيل حساسة.</div>${list.map(x=>{let a=db.documents[x.id]||{};return `<div class="panel" data-evidence-id="${attr(x.id)}"><div class="spaceBetween"><div>${chip(x.id)} ${chip(x.priority||'')}${chip(x.category||'')}</div><select data-evidence="status" data-id="${attr(x.id)}">${opts(['تم العرض','لم يُعرض بعد','قيد المراجعة','لا ينطبق'],a.status,'حالة الطلب')}</select></div><h3 style="font-size:15px;margin-top:10px">${esc(x.title)}</h3><div class="formGrid"><div class="field"><label>مرجع الدليل أو تاريخ العرض</label><input data-evidence="reference" data-id="${attr(x.id)}" value="${attr(a.reference||'')}"></div><div class="field half"><label>الملاحظات</label><input data-evidence="note" data-id="${attr(x.id)}" value="${attr(a.note||'')}"></div></div></div>`}).join('')}`}

function renderInstall(){const isStandalone=window.matchMedia?.('(display-mode: standalone)').matches||window.navigator.standalone===true;
const secure=window.isSecureContext && location.protocol!=='file:';
return `<div class="sectionTitle"><div><h2>تثبيت التطبيق على الآيفون</h2><p>خطوات سريعة حتى يكون جاهزاً أثناء الزيارة بدون اتصال بالشبكة.</p></div></div>
<div class="panel"><h3>الحالة الحالية</h3><div class="wrap">${chip(isStandalone?'✓ مفتوح من أيقونة الشاشة الرئيسية':'يعمل داخل المتصفح',isStandalone?'good':'focus')}${chip(secure?'✓ رابط آمن HTTPS/localhost':'⚠ افتح رابط HTTPS أولاً',secure?'good':'focus')}<span id="installOfflineStatus" class="chip">${navigator.onLine?'متصل بالإنترنت':'بدون إنترنت'}</span></div></div>

<div class="panel"><h3>الحفظ وخصوصية البيانات</h3><p>الملاحظات والأجوبة تُحفظ في مساحة التخزين المحلية على هذا الجهاز فقط، ولا توجد حسابات أو قاعدة بيانات أو إرسال تلقائي إلى خادم. الموقع المنشور يحتوي أسئلة التقييم العامة فقط، وليس ملاحظاتك.</p><div class="wrap">${btn('تنزيل نسخة JSON احتياطية','backup','primary')}${btn('استيراد نسخة سابقة','import')}${btn('العودة للأسئلة','assessment')}</div><p class="muted" style="margin-top:12px">لا تدخل أسماء عملاء أو كلمات مرور أو مفاتيح تشفير. يفضّل حفظ ملف النسخة الاحتياطية ضمن مساحة تخزين مصرح بها.</p></div>`;}
function renderSettings(){let m=db.meta;let defs=[['bank','المؤسسة / الجهة','text',''],['date','تاريخ الزيارة','date',''],['company','الجهة الطالبة أو الشركة المعنية بالتطوير','text',''],['assessor','فريق التقييم','text',''],['attendees','الحاضرون / جهات التواصل','textarea',''],['scope','نطاق التقييم وحدوده','textarea',''],['executive','خلاصة تنفيذية أولية (يمكن إكمالها في النهاية)','textarea',''],['positive','نقاط القوة القائمة','textarea',''],['limitations','الافتراضات وحدود التحقق','textarea','']];return `<div class="sectionTitle"><h2>معلومات الزيارة والتكليف</h2></div><div class="panel"><p class="muted">هذه الحقول تظهر في غلاف التقرير النهائي. حدّد حدود الاطلاع والمسؤوليات بوضوح.</p><div class="formGrid">${fieldGroup(m,defs,'meta')}</div></div><div class="panel"><h3>نسخ العمل واسترجاعه</h3><p class="muted">الحفظ آلي داخل المتصفح عندما يسمح بذلك. تصدير JSON هو النسخة الموثوقة التي يمكن إعادة فتحها على أي جهاز.</p><div class="wrap">${btn('⬇ تنزيل نسخة احتياطية JSON','backup','primary')}${btn('⬆ استيراد نسخة JSON','import')}${btn('إنشاء تقرير HTML مستقل','downloadReport')}${btn('طباعة / حفظ PDF','printReport')}</div></div><div class="pwaCallout noPrint"><h3>📱 تثبيت وتشغيل على الآيفون</h3><p>مهم: إذا انتقلت من Safari إلى أيقونة التطبيق قد يكون التخزين منفصلاً؛ صدّر JSON أولاً ثم استورده من داخل التطبيق.</p>${btn('خطوات التثبيت والتحقق من وضع Offline','install')}</div><div class="notice">تعامل مع هذه البيانات كبيانات مصرفية داخلية: يُفضّل إبقاؤها على جهاز العمل المُصرّح به، وعدم مشاركتها إلا مع الفريق المعني وفق نطاق التكليف.</div>`}
function reportCounts(){let valid=SOURCE.questions.filter(q=>filled(db.answers[q.id]));let statusCounts={};valid.forEach(q=>{let k=db.answers[q.id].status||'لم تُحدد الحالة';statusCounts[k]=(statusCounts[k]||0)+1});return {valid,statusCounts}};
function rf(label,value,empty='لم يوثق بعد'){return `<div class="reportField"><b>${esc(label)}:</b> <span class="reportText">${esc(value||empty)}</span></div>`}
function reportHTML(forPrint=false){const {valid,statusCounts}=reportCounts(),st=stats(),meta=db.meta;let rows=SOURCE.questions.filter(q=>reportAll||filled(db.answers[q.id]));let domains=domainIds.map(s=>({s,rows:rows.filter(q=>q.section===s)})).filter(x=>x.rows.length);let serviceRows=db.services;let evidenceRows=SOURCE.evidence.filter(e=>filled(db.documents[e.id]));let meetings=SOURCE.interview.map((x,i)=>({...x,answer:db.meeting[i]})).filter(x=>String(x.answer||'').trim());return `<div class="hero"><div><div style="font-weight:800;color:#1a7777">تقرير التقييم التطويري للبنية التقنية</div><h1 style="margin:7px 0">${esc(meta.bank||'المؤسسة')}</h1><p style="color:#345">الزيارة: ${esc(meta.date||'غير محدد')} · الجهة: ${esc(meta.company||'لم تُحدد')} · التقييم: ${esc(meta.assessor||'لم يُحدد')}</p></div></div>
<div class="panel"><h2>1. الهدف ونطاق العمل</h2>${rf('الهدف','تقييم تشاركي للوضع التقني الحالي وتحديد فرص التحسين وترتيب خطوات التطوير بحسب حرجية الأعمال والأدلة المتاحة.')}${rf('نطاق الزيارة',meta.scope)}${rf('المشاركون',meta.attendees)}${rf('الحدود والافتراضات',meta.limitations,'لم تذكر؛ النتائج غير المتحقّق منها لا تُعد خللاً مثبتاً.')}</div>
<div class="gridStats"><div class="stat"><strong>${st.filled} / ${SOURCE.questions.length}</strong><span>نقاط موثقة</span></div><div class="stat"><strong>${st.services}</strong><span>خدمات موثقة</span></div><div class="stat"><strong>${st.critical+st.high}</strong><span>أولويات حرجة وعالية</span></div><div class="stat"><strong>${st.evidence}</strong><span>أدلة عُرضت</span></div></div>
<div class="panel"><h2>2. الملخص التنفيذي</h2>${rf('التقدير والخلاصة',meta.executive)}${rf('ما يعمل بشكل جيد',meta.positive)}<div class="reportField"><b>توزيع الحالات المسجلة:</b> ${Object.entries(statusCounts).map(([k,v])=>chip(k+' · '+v)).join(' ')||'لم تُحدَّد بعد'}</div><div class="notice">هذا التقرير استشاري وتحسيني وليس شهادة امتثال أو اختبار اختراق أو حكماً نظامياً. المعلومة غير المثبتة لا تعني عدم وجود الضابط؛ تُدرج كحاجة إلى تحقق إضافي.</div></div>
<h2 class="sectionDivider">3. جرد الخدمات والأنظمة المصرفية</h2>${serviceRows.length?serviceRows.map((s,i)=>`<div class="reportCard"><h4>${i+1}. ${esc(s.name||'نظام بدون اسم')} ${chip(s.criticality||'الحرجية غير محددة')}</h4><div class="threeCol">${rf('البرنامج / المورد',s.product)}${rf('نوع الخدمة',s.category)}${rf('المالك',s.owner)}${rf('حساسية البيانات',s.confidentiality)}${rf('المستخدمون / الفروع',s.users)}${rf('الاستضافة',s.hosting)}${rf('وحدات النظام',s.modules)}${rf('طبقة التطبيق / Cluster',s.appHA)}${rf('Load Balancer',s.lb)}${rf('تصميم LB',s.lbDesign)}${rf('Database HA',s.dbHA)}${rf('Storage HA',s.storageHA)}${rf('Network/WAN HA',s.wanHA)}${rf('النسخ الاحتياطي',s.backup)}${rf('خطة DR',s.drPlan)}${rf('RTO المطلوب / الفعلي',(s.rtoTarget||'؟')+' / '+(s.rtoActual||'لم يثبت'))}${rf('RPO المطلوب / الفعلي',(s.rpoTarget||'؟')+' / '+(s.rpoActual||'لم يثبت'))}${rf('آخر اختبار Restore',s.restore)}${rf('آخر اختبار DR',s.drTest)}</div>${rf('الاعتماديات ونقاط الفشل',([s.dependencies,s.spof].filter(Boolean).join(' | ')))}${rf('الوضع الحالي',s.current)}${rf('الملاحظات',s.observation)}${rf('الحلول والتحسينات',s.solution)}${rf('الأولوية / المرحلة',(s.priority||'غير محددة')+' / '+(s.phase||'لم تحدد'))}${rf('المستند أو الدليل',s.evidence)}${rf('المسؤول المقترح',s.ownerAction)}</div>`).join(''):'<div class="panel muted">لم تُسجّل خدمات فعلية بعد. فئات الاستكشاف لا تُحتسب جرداً.</div>'}
<h2 class="sectionDivider">4. النتائج الفنية التفصيلية حسب المجال</h2>${domains.length?domains.map(({s,rows})=>`<h3 style="margin:22px 0 11px">${esc(domainTitle(s))} <span class="muted" style="font-weight:400;font-size:12px">(${rows.length} نقطة)</span></h3>${rows.map(q=>{let a=db.answers[q.id]||{};return `<div class="reportCard"><h4>${esc(q.id)} · ${esc(q.question)}</h4><div class="reportField"><b>السؤال المستخدم بالحوار:</b> ${esc(q.ask||q.question)}</div><div class="wrap" style="margin-bottom:10px">${chip('الحالة: '+(a.status||'غير مثبتة'))}${chip('الأولوية: '+(a.priority||'لم تحدد'))}</div>${rf('الوضع الحالي',a.current)}${rf('الملاحظات',a.observation)}${rf('الحلول / التحسينات',a.solution)}${a.evidence?rf('الدليل المعروض',a.evidence):''}${a.owner?rf('الجهة المسؤولة',a.owner):''}${a.deadline?rf('الإطار الزمني',a.deadline):''}</div>`}).join('')}`).join(''):'<div class="panel muted">لا توجد نقاط موثقة بعد.</div>'}
<h2 class="sectionDivider">5. أولويات وخارطة التحسين المقترحة</h2><div class="panel"><p class="muted">ترتيب أولي بحسب الأولوية المسجلة، ويحتاج اعتماد مالك الخدمة والميزانية والاعتماديات قبل تحويله لخطة تنفيذ.</p>${['حرج','عالٍ','متوسط','منخفض','تحسين مستقبلي'].map(p=>{let items=[...valid.map(q=>({id:q.id,name:q.question,...db.answers[q.id]})),...db.services.map(s=>({id:s.id,name:s.name,...s}))].filter(x=>x.priority===p);return items.length?`<h3>${esc(p)} (${items.length})</h3><div class="tableWrap"><table><thead><tr><th>البند</th><th>التحسين</th><th>المسؤول / المرحلة</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.id)} · ${esc(x.name||'')}</td><td>${esc(x.solution||'يحدد بعد جمع الأدلة')}</td><td>${esc(x.owner||x.ownerAction||'يحدد')} ${esc(x.deadline||x.phase||'')}</td></tr>`).join('')}</tbody></table></div>`:''}).join('')||'<p>لم تُحدّد أولويات بعد.</p>'}</div>
<h2 class="sectionDivider">6. المستندات والأدلة المعروضة / التي تحتاج متابعة</h2><div class="panel"><div class="tableWrap"><table><thead><tr><th>المرجع</th><th>المستند</th><th>الحالة</th><th>الملاحظات</th></tr></thead><tbody>${(evidenceRows.length?evidenceRows:SOURCE.evidence.filter(x=>x.priority==='عاجل')).map(x=>{let a=db.documents[x.id]||{};return `<tr><td>${esc(x.id)}</td><td>${esc(x.title)}</td><td>${esc(a.status||'لم يُبحث بعد')}</td><td>${esc([a.reference,a.note].filter(Boolean).join(' — ')||'')}</td></tr>`}).join('')}</tbody></table></div></div>
${meetings.length?`<h2 class="sectionDivider">7. ملاحظات اللقاء</h2><div class="panel">${meetings.map(x=>`<div class="listItem"><b>${esc(x.question)}</b><div class="reportText">${esc(x.answer)}</div></div>`).join('')}</div>`:''}
<div class="panel"><h2>خطوات الاعتماد والمتابعة</h2><p>التوصيات الواردة مقترحات فنية أولية؛ تُراجع مع مالكي الخدمات والأعمال والفريق المختص، ثم تُعتمد وفق تحليل أثر الأعمال والموازنة ومتطلبات الجهة المنظمة.</p><p class="muted">تاريخ إعداد المسودة: ${esc(new Date().toLocaleDateString('ar-SY'))}. أسماء الأنظمة غير المثبتة لا تُفترض، والتقييم لا يستلزم كشف بيانات مصرفية أو أسرار تشغيل.</p></div>`}
function renderReport(){const st=stats();return `<div class="sectionTitle noPrint"><div><h2>معاينة التقرير الفني</h2><p>يتكوّن مباشرة من الوضع الحالي والملاحظات والحلول المسجلة لكل نقطة وخدمة.</p></div></div><div class="panel noPrint"><div class="spaceBetween"><label><input type="checkbox" id="reportAll" ${reportAll?'checked':''}> تضمين جميع الأسئلة، حتى التي لم تُعبَّأ بعد</label><div class="wrap">${btn('تنزيل التقرير HTML','downloadReport','primary')}${btn('طباعة / حفظ PDF','printReport')}${btn('حفظ البيانات JSON','backup')}</div></div></div>${reportHTML(false)}`}
function downloadFile(filename,text,ctype='text/plain;charset=utf-8'){const blob=new Blob([text],{type:ctype});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=filename;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function downloadBackup(){persist();const date=(db.meta.date||'assessment').replace(/[^\d-]/g,'');downloadFile('SCB_Assessment_Backup_'+date+'.json',JSON.stringify({version:1,createdAt:new Date().toISOString(),...db},null,2),'application/json;charset=utf-8');toast('تم إعداد نسخة البيانات للتنزيل')}
function downloadReport(){const pageHTML=`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التقرير الفني - ${esc(db.meta.bank)}</title><style>${document.querySelector('style').textContent.replaceAll('body.printOnly #appMain{display:none!important}','')}body{max-width:1040px;margin:auto;padding:24px;background:#fff}.hero{background:white;color:#1b4050}.hero p{color:#345}.reportCard{break-inside:avoid}.noPrint{display:none!important}@media print{body{padding:0}}</style></head><body>${reportHTML(true)}<div class="noPrint" style="padding:20px"><button onclick="window.print()">طباعة / حفظ PDF</button></div></body></html>`;downloadFile('SCB_Development_Report_'+(db.meta.date||'2026-11-02')+'.html',pageHTML,'text/html;charset=utf-8');toast('تم إنشاء التقرير المستقل')}
async function importBackup(file){if(!file)return;try{const input=JSON.parse(await file.text());let data=normData(input);if(!confirm('استيراد الملف سيستبدل كل المعلومات الموجودة في هذه الصفحة. هل لديك نسخة احتياطية؟'))return;db=data;currentService=null;persist();go('home');toast('تم استعادة نسخة البيانات بنجاح')}catch(e){alert('تعذر قراءة نسخة البيانات. تأكد أنه ملف JSON صادر عن هذه الأداة.')}}
function previous(){let q=SOURCE.questions.filter(x=>x.section===domain);if(mode==='single'&&qindex>0){qindex--;render();window.scrollTo(0,0)}else{let i=domainIds.indexOf(domain);if(i>0){domain=domainIds[i-1];qindex=SOURCE.questions.filter(x=>x.section===domain).length-1;render();window.scrollTo(0,0)}}}
function next(){let q=SOURCE.questions.filter(x=>x.section===domain);if(mode==='single'&&qindex<q.length-1){qindex++;render();window.scrollTo(0,0)}else{let i=domainIds.indexOf(domain);if(i<domainIds.length-1){domain=domainIds[i+1];qindex=0;render();window.scrollTo(0,0)}else go('report')}}
function addService(src){let id='SVC-'+Date.now().toString(36);let s={id, ...src};db.services.push(s);currentService=id;serviceTab='general';autosave();go('inventory')}
const handlers={assessment:()=>go('assessment'),inventory:()=>go('inventory'),settings:()=>go('settings'),report:()=>go('report'),previous,next,backup:downloadBackup,import:()=>el('importFile').click(),downloadReport,printReport:()=>{page='report';render();document.body.classList.add('printOnly');window.print();setTimeout(()=>document.body.classList.remove('printOnly'),500)},addService:()=>addService({}),addFromCatalog:()=>{const value=el('catalogSelect')?.value;if(value===''){toast('اختر نوع الخدمة أولاً');return}let c=SOURCE.catalog[Number(value)];if(!confirm('هل أكد الفريق وجود هذه الخدمة؟ ستُضاف كسجل فعلي قابل للتعديل.'))return;addService({name:c.name,category:c.group})},deleteService:()=>{if(!currentService)return;let svc=db.services.find(x=>x.id===currentService);if(confirm('حذف سجل "'+(svc.name||'نظام')+'" نهائياً من البيانات الحالية؟')){db.services=db.services.filter(x=>x.id!==currentService);currentService=db.services[0]?.id||null;autosave();render()}}};
document.addEventListener('click',e=>{let t=e.target.closest('[data-nav],[data-domain],[data-action],[data-service],[data-service-tab]');if(!t)return;if(t.dataset.nav){go(t.dataset.nav);return}if(t.dataset.domain){domain=t.dataset.domain;qindex=0;go('assessment');return}if(t.dataset.action){handlers[t.dataset.action]?.();return}if(t.dataset.service){currentService=t.dataset.service;serviceTab='general';render();return}if(t.dataset.serviceTab){serviceTab=t.dataset.serviceTab;render();return}});
document.addEventListener('input',e=>{const t=e.target;if(t.matches('[data-answer]')){let id=t.dataset.id;db.answers[id]??={};db.answers[id][t.dataset.answer]=t.value;autosave();navRender();return}if(t.matches('[data-meta]')){db.meta[t.dataset.meta]=t.value;autosave();return}if(t.matches('[data-svc-field]')){const s=db.services.find(x=>x.id===currentService);if(s){s[t.dataset.svcField]=t.value;autosave()}return}if(t.matches('[data-evidence]')){let id=t.dataset.id;db.documents[id]??={};db.documents[id][t.dataset.evidence]=t.value;autosave();return}if(t.matches('[data-meeting]')){db.meeting[t.dataset.meeting]=t.value;autosave();return}});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-answer],[data-meta],[data-svc-field],[data-evidence],[data-meeting]')){t.dispatchEvent(new Event('input',{bubbles:true}));return}if(t.id==='domainSelect'){domain=t.value;qindex=0;render()}else if(t.id==='modeSelect'){mode=t.value;render()}else if(t.id==='questionSelect'){qindex=Number(t.value);render()}else if(t.id==='evidenceFilter'){evidenceFilter=t.value;render()}else if(t.id==='reportAll'){reportAll=t.checked;render()}});
el('backupTop').onclick=downloadBackup;el('goReportTop').onclick=()=>go('report');el('menuBtn').onclick=()=>el('sidebar').classList.toggle('open');el('importFile').addEventListener('change',e=>{importBackup(e.target.files?.[0]);e.target.value=''});
// iOS قد يعلّق التطبيق في الخلفية دون beforeunload: احفظ فور انتقال الصفحة للخلفية.
function flushPendingSave(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;}persist();}
window.addEventListener('pagehide',flushPendingSave);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushPendingSave();});
window.addEventListener('beforeunload',flushPendingSave);
function refreshNetworkStatus(){let n=el('netStatus');if(!n)return;n.textContent=navigator.onLine?'● متصل':'● دون إنترنت';n.classList.toggle('offline',!navigator.onLine);}
window.addEventListener('online',()=>{refreshNetworkStatus();toast('عاد الاتصال بالشبكة؛ بياناتك ما زالت على الجهاز');});
window.addEventListener('offline',()=>{refreshNetworkStatus();toast('وضع Offline جاهز. بياناتك تحفظ على الجهاز');});
refreshNetworkStatus();
if('serviceWorker' in navigator && (location.protocol==='https:' || ['localhost','127.0.0.1'].includes(location.hostname))){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js',{scope:'./'})
      .then(reg=>{if(reg.active)console.info('Offline app shell active');})
      .catch(e=>{console.warn('Offline cache unavailable',e);toast('لم يتم تفعيل التخزين دون إنترنت؛ تحقق من اتصالك وجرب مجدداً');});
  });
}

// Expose only read-only diagnostic stats for optional local verification.
window.__SCB_CHECK__=()=>({questions:SOURCE.questions.length,catalog:SOURCE.catalog.length,domains:domainIds.length,services:db.services.length,reportLength:reportHTML().length,saveEnabled});
render();if(!saveEnabled)toast('الحفظ المحلي غير متاح في هذا المتصفح؛ احفظ نسخ JSON دورياً');
</script>
